name: CI & Release

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Documentation and Stack Composer
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout labo-smart-home
        uses: actions/checkout@v7
        with:
          path: labo-smart-home

      - name: Checkout lsh-core contract provider
        uses: actions/checkout@v7
        with:
          repository: labodj/lsh-core
          path: lsh-core

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: labo-smart-home/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python3 -m pip install --upgrade pip uv

      - name: Install PlatformIO Core
        run: python3 -m pip install --upgrade platformio

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('labo-smart-home/uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Install Node dependencies
        working-directory: labo-smart-home
        run: npm ci

      - name: Install Python dependencies
        working-directory: labo-smart-home
        run: uv sync --locked --all-groups

      - name: Run quality gate
        working-directory: labo-smart-home
        run: npm run check

      - name: Validate public stack examples
        working-directory: labo-smart-home
        run: |
          uv run lsh-stack check --config examples/lsh_stack.minimal.toml
          uv run lsh-stack check --config examples/lsh_stack.network-clicks.toml
          uv run lsh-stack check --config examples/lsh_stack.complete.toml

      - name: Smoke-test artifact generation
        working-directory: labo-smart-home
        run: |
          rm -rf examples/generated
          uv run lsh-stack generate --config examples/lsh_stack.complete.toml
          test -s examples/generated/lsh-stack-config.json
          test -s examples/generated/system-config.json
          test -s examples/generated/node-red-lsh-logic.json
          test -s examples/generated/bridge-platformio-flags/bridge.txt
          rm -rf examples/generated

      - name: Build and smoke-test release zipapp
        working-directory: labo-smart-home
        run: npm run smoke:firmware

  release:
    name: Publish GitHub Release
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout labo-smart-home
        uses: actions/checkout@v7
        with:
          path: labo-smart-home

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO Core
        run: python3 -m pip install --upgrade platformio

      - name: Verify package version matches tag
        working-directory: labo-smart-home
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PACKAGE_VERSION=$(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])
          PY
          )
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: pyproject.toml version ($PACKAGE_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi

      - name: Build and smoke-test lsh-stack.pyz
        working-directory: labo-smart-home
        run: ./scripts/build_and_smoke_zipapp.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: labo-smart-home ${{ github.ref_name }}
          generate_release_notes: true
          files: labo-smart-home/dist/lsh-stack.pyz
